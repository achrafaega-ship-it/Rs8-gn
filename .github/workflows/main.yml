name: AI-Sniper-Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests
      - run: python update.py
      - name: Save
        run: |
          git config --global user.name "AEGA-Bot"
          git config --global user.email "bot@aega.com"
          git add playlist.m3u
          git commit -m "Update playlist.m3u" || exit 0
          git push
          
